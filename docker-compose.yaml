services:
  web_admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodonline.web-admin
  nginx_server:
    image: nginx:alpine
    container_name: foodonline.web-admin-nginx
    ports:
      - '4580:80'
      - '4443:443'
    volumes:
      - ./dist:/usr/share/nginx/html
